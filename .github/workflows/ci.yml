name: flutter-sdk-ci
on:
  push:
  pull_request:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: python3 scripts/verify-native-publication.py
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  native-consumer:
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
          - os: macos-latest
            platform: ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: ruby/setup-ruby@v1
        if: matrix.platform == 'ios'
        with:
          ruby-version: '3.3'
      - run: gem install cocoapods -v 1.16.2 --no-document
        if: matrix.platform == 'ios'
      - run: python3 scripts/verify-consumer.py --platform ${{ matrix.platform }}
