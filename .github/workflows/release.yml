name: flutter-sdk-release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish push_platform_flutter to pub.dev
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  pub:
    if: inputs.publish && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Publish to pub.dev
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          set -eu
          version=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://pub.dev/api/packages/push_platform_flutter/versions/${version}")
          if [ "$code" = "200" ]; then
            echo "pub.dev already has ${version}"
            exit 0
          fi
          if [ -z "${PUB_CREDENTIALS}" ]; then
            echo "PUB_CREDENTIALS is not set, so ${version} cannot be published" >&2
            exit 1
          fi
          mkdir -p "$HOME/.config/dart"
          printf '%s' "$PUB_CREDENTIALS" > "$HOME/.config/dart/pub-credentials.json"
          flutter pub publish --force
