name: push_platform_flutter
description: PushPilot Flutter SDK for Android and iOS push notifications, installation registration, user association, and native call events.
version: 1.0.0
homepage: https://github.com/pushplatform/pushpilot-sdk-flutter
repository: https://github.com/pushplatform/pushpilot-sdk-flutter
issue_tracker: https://github.com/pushplatform/pushpilot-sdk-flutter/issues
topics:
  - push-notifications
  - pushpilot
platforms:
  android:
  ios:

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: FlutterPushPlatformPlugin
      android:
        package: com.pushplatform.flutter
        pluginClass: FlutterPushPlatformPlugin
